spring.application.name=connect4-ssr
server.port=8080

# The static JS bundle from the Compose HTML build is staged into
# /static during the JVM resource processing step, so Spring's default
# classpath:/static/** mapping serves it transparently. We disable
# fingerprinted resource resolution because the bundle filename is fixed
# and the page renderer references it directly.
spring.web.resources.cache.cachecontrol.no-store=true

# The SSR pipeline does not need view resolvers or template engines.
spring.thymeleaf.enabled=false

logging.level.root=INFO
logging.level.connect4=INFO
